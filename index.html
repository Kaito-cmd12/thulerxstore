<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo Minimalista</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel para interpretar o JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Ponto de montagem do React -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminDashboard() {
      const [activeTab, setActiveTab] = useState('produtos');

      // Lista de Categorias
      const [categories, setCategories] = useState([
        { id: 1, name: 'Eletrônicos', description: 'Gadgets e periféricos' },
        { id: 2, name: 'Acessórios', description: 'Capas, cabos e suportes' }
      ]);

      // Lista de Produtos
      const [products, setProducts] = useState([
        { id: 1, name: 'Fone Bluetooth Minimal', category: 'Eletrônicos', price: 'R$ 299,00' },
        { id: 2, name: 'Suporte de Alumínio', category: 'Acessórios', price: 'R$ 89,00' }
      ]);

      // Campos do Formulário de Categoria
      const [catName, setCatName] = useState('');
      const [catDesc, setCatDesc] = useState('');
      const [editingCatId, setEditingCatId] = useState(null);

      // Campos do Formulário de Produto
      const [prodName, setProdName] = useState('');
      const [prodCategory, setProdCategory] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      const [editingProdId, setEditingProdId] = useState(null);

      // Atualiza os ícones na tela sempre que a aba muda
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, categories, products]);

      // --- AÇÕES DE CATEGORIAS ---
      const handleSaveCategory = () => {
        if (!catName) return;

        if (editingCatId) {
          setCategories(categories.map(c => c.id === editingCatId ? { ...c, name: catName, description: catDesc } : c));
          setEditingCatId(null);
        } else {
          setCategories([...categories, { id: Date.now(), name: catName, description: catDesc || 'Sem descrição' }]);
        }

        setCatName('');
        setCatDesc('');
      };

      const handleEditCategory = (category) => {
        setEditingCatId(category.id);
        setCatName(category.name);
        setCatDesc(category.description);
      };

      const handleDeleteCategory = (id) => {
        setCategories(categories.filter(c => c.id !== id));
      };

      // --- AÇÕES DE PRODUTOS ---
      const handleSaveProduct = () => {
        if (!prodName || !prodPrice) return;

        if (editingProdId) {
          setProducts(products.map(p => p.id === editingProdId ? { ...p, name: prodName, category: prodCategory || 'Geral', price: prodPrice } : p));
          setEditingProdId(null);
        } else {
          setProducts([...products, { id: Date.now(), name: prodName, category: prodCategory || 'Geral', price: prodPrice }]);
        }

        setProdName('');
        setProdCategory('');
        setProdPrice('');
      };

      const handleEditProduct = (product) => {
        setEditingProdId(product.id);
        setProdName(product.name);
        setProdCategory(product.category);
        setProdPrice(product.price);
      };

      const handleDeleteProduct = (id) => {
        setProducts(products.filter(p => p.id !== id));
      };

      return (
        <div className="flex h-screen overflow-hidden">
          
          <!-- Menu Lateral -->
          <aside className="w-64 bg-white border-r border-gray-100 p-6 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-10">
                <div className="w-9 h-9 rounded-xl bg-[#0084FF] flex items-center justify-center text-white font-bold text-lg shadow-sm">
                  A
                </div>
                <div>
                  <h2 className="font-bold text-base text-gray-900 leading-none">AdminPanel</h2>
                  <span className="text-[10px] text-gray-400 font-medium">Equipe de Gestão</span>
                </div>
              </div>

              <nav className="space-y-1">
                <button 
                  onClick={() => setActiveTab('produtos')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                    activeTab === 'produtos' 
                      ? 'bg-[#0084FF]/10 text-[#0084FF]' 
                      : 'text-gray-500 hover:bg-gray-50'
                  }`}
                >
                  <i data-lucide="package" class="w-4 h-4"></i> Produtos
                </button>

                <button 
                  onClick={() => setActiveTab('categorias')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                    activeTab === 'categorias' 
                      ? 'bg-[#0084FF]/10 text-[#0084FF]' 
                      : 'text-gray-500 hover:bg-gray-50'
                  }`}
                >
                  <i data-lucide="folder" class="w-4 h-4"></i> Categorias
                </button>

                <button 
                  onClick={() => setActiveTab('calls')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                    activeTab === 'calls' 
                      ? 'bg-[#0084FF]/10 text-[#0084FF]' 
                      : 'text-gray-500 hover:bg-gray-50'
                  }`}
                >
                  <i data-lucide="video" class="w-4 h-4"></i> Sala de Reunião
                </button>
              </nav>
            </div>

            <div className="pt-6 border-t border-gray-100 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-[#0084FF]/20 text-[#0084FF] font-bold flex items-center justify-center text-xs">
                  EQ
                </div>
                <div>
                  <p className="text-xs font-semibold text-gray-700">Minha Equipe</p>
                  <p className="text-[10px] text-gray-400">admin@empresa.com</p>
                </div>
              </div>
            </div>
          </aside>

          <!-- Conteúdo Principal -->
          <main className="flex-1 overflow-y-auto p-10">
            
            <!-- ABA PRODUTOS -->
            {activeTab === 'produtos' && (
              <section className="max-w-4xl mx-auto">
                <h1 className="text-2xl font-bold mb-1 text-gray-900">Gerenciamento de Produtos</h1>
                <p className="text-sm text-gray-400 mb-8">Adicione, edite ou remova produtos do seu catálogo.</p>

                <!-- Form Produto -->
                <div className="bg-white p-6 rounded-2xl border border-gray-100 mb-8 flex flex-col md:flex-row gap-4 items-end shadow-sm">
                  <div className="flex-1 w-full">
                    <label className="text-xs font-medium text-gray-500 block mb-1">Nome do Produto</label>
                    <input 
                      type="text" 
                      value={prodName}
                      onChange={(e) => setProdName(e.target.value)}
                      placeholder="Ex: Fone Sem Fio"
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0084FF]"
                    />
                  </div>
                  
                  <div className="w-full md:w-48">
                    <label className="text-xs font-medium text-gray-500 block mb-1">Categoria</label>
                    <select
                      value={prodCategory}
                      onChange={(e) => setProdCategory(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0084FF] bg-white"
                    >
                      <option value="">Selecione...</option>
                      {categories.map(c => (
                        <option key={c.id} value={c.name}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="w-full md:w-36">
                    <label className="text-xs font-medium text-gray-500 block mb-1">Preço</label>
                    <input 
                      type="text" 
                      value={prodPrice}
                      onChange={(e) => setProdPrice(e.target.value)}
                      placeholder="R$ 0,00"
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0084FF]"
                    />
                  </div>

                  <button 
                    onClick={handleSaveProduct}
                    className="w-full md:w-auto bg-[#0084FF] hover:bg-[#0073E6] text-white px-6 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-all"
                  >
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    {editingProdId ? 'Atualizar' : 'Criar'}
                  </button>
                </div>

                <!-- Tabela de Produtos -->
                <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-gray-100 text-xs text-gray-400 uppercase font-medium bg-gray-50/50">
                        <th className="p-4 pl-6">Nome</th>
                        <th className="p-4">Categoria</th>
                        <th className="p-4">Preço</th>
                        <th className="p-4 text-right pr-6">Ações</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-50 text-sm">
                      {products.map((item) => (
                        <tr key={item.id} className="hover:bg-gray-50/50 transition-all">
                          <td className="p-4 pl-6 font-medium text-gray-800">{item.name}</td>
                          <td className="p-4 text-gray-500">{item.category}</td>
                          <td className="p-4 font-semibold text-[#0084FF]">{item.price}</td>
                          <td className="p-4 text-right pr-6 space-x-2">
                            <button 
                              onClick={() => handleEditProduct(item)}
                              className="p-2 hover:bg-gray-100 rounded-lg text-gray-500 transition-all"
                            >
                              <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button 
                              onClick={() => handleDeleteProduct(item.id)}
                              className="p-2 hover:bg-red-50 rounded-lg text-red-500 transition-all"
                            >
                              <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            <!-- ABA CATEGORIAS -->
            {activeTab === 'categorias' && (
              <section className="max-w-4xl mx-auto">
                <h1 className="text-2xl font-bold mb-1 text-gray-900">Gerenciamento de Categorias</h1>
                <p className="text-sm text-gray-400 mb-8">Organize os produtos em grupos organizados.</p>

                <!-- Form Categoria -->
                <div className="bg-white p-6 rounded-2xl border border-gray-100 mb-8 flex flex-col md:flex-row gap-4 items-end shadow-sm">
                  <div className="flex-1 w-full">
                    <label className="text-xs font-medium text-gray-500 block mb-1">Nome da Categoria</label>
                    <input 
                      type="text" 
                      value={catName}
                      onChange={(e) => setCatName(e.target.value)}
                      placeholder="Ex: Eletrônicos"
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0084FF]"
                    />
                  </div>

                  <div className="flex-1 w-full">
                    <label className="text-xs font-medium text-gray-500 block mb-1">Descrição</label>
                    <input 
                      type="text" 
                      value={catDesc}
                      onChange={(e) => setCatDesc(e.target.value)}
                      placeholder="Breve resumo da categoria"
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0084FF]"
                    />
                  </div>

                  <button 
                    onClick={handleSaveCategory}
                    className="w-full md:w-auto bg-[#0084FF] hover:bg-[#0073E6] text-white px-6 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-all"
                  >
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    {editingCatId ? 'Atualizar' : 'Criar'}
                  </button>
                </div>

                <!-- Lista de Categorias -->
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {categories.map((cat) => (
                    <div key={cat.id} className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center justify-between shadow-sm">
                      <div>
                        <h3 className="font-semibold text-gray-800">{cat.name}</h3>
                        <p className="text-xs text-gray-400 mt-1">{cat.description}</p>
                      </div>
                      <div className="flex gap-1">
                        <button 
                          onClick={() => handleEditCategory(cat)}
                          className="p-2 hover:bg-gray-100 rounded-lg text-gray-500 transition-all"
                        >
                          <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button 
                          onClick={() => handleDeleteCategory(cat.id)}
                          className="p-2 hover:bg-red-50 rounded-lg text-red-500 transition-all"
                        >
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            <!-- ABA SISTEMA DE CALL -->
            {activeTab === 'calls' && (
              <section className="max-w-4xl mx-auto">
                <h1 className="text-2xl font-bold mb-1 text-gray-900">Sistema de Chamadas em Equipe</h1>
                <p className="text-sm text-gray-400 mb-8">Inicie reuniões com voz, vídeo e compartilhamento de tela instantâneos.</p>

                <div className="bg-white p-10 rounded-2xl border border-gray-100 text-center max-w-lg mx-auto shadow-sm">
                  <div className="w-16 h-16 bg-[#0084FF]/10 text-[#0084FF] rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="video" class="w-8 h-8"></i>
                  </div>
                  <h2 className="text-xl font-bold text-gray-800 mb-2">Sala de Reunião Direta</h2>
                  <p className="text-xs text-gray-400 mb-6 leading-relaxed">
                    Clique no botão abaixo para abrir a sala virtual da equipe. Qualquer pessoa da sua equipe que clicar no mesmo botão entrará na mesma chamada.
                  </p>
                  
                  <a 
                    href="https://meet.jit.si/PainelAdminEquipeMinhaCallExclusiva" 
                    target="_blank" 
                    rel="noreferrer"
                    className="w-full inline-flex items-center justify-center gap-2 bg-[#0084FF] hover:bg-[#0073E6] text-white py-3.5 px-6 rounded-xl font-medium transition-all shadow-md shadow-[#0084FF]/20"
                  >
                    <i data-lucide="phone-call" class="w-5 h-5"></i> Entrar na Reunião Agora
                  </a>
                </div>
              </section>
            )}

          </main>
        </div>
      );
    }

    // Renderiza a aplicação no elemento root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminDashboard />);
  </script>
</body>
</html>
